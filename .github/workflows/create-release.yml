name: Build and Create Release

permissions:
  contents: write

on:
  push:
    tags:
      - "v*.*.*"

jobs:
  build-linux:
    name: Build Linux
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
            asset: wtf-linux-amd64.tar.gz
            use_cross: false
          - target: aarch64-unknown-linux-gnu
            asset: wtf-linux-arm64.tar.gz
            use_cross: true

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install cross
        if: matrix.use_cross
        run: cargo install cross

      - name: Build
        run: |
          if [ "${{ matrix.use_cross }}" = "true" ]; then
            cross build --release --target ${{ matrix.target }}
          else
            rustup target add ${{ matrix.target }}
            cargo build --release --target ${{ matrix.target }}
          fi

      - name: Package
        run: |
          mkdir dist
          cp target/${{ matrix.target }}/release/wtf dist/
          tar czf ${{ matrix.asset }} -C dist wtf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.asset }}
          path: ${{ matrix.asset }}

  build-macos:
    name: Build macOS universal
    runs-on: macos-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Add targets
        run: |
          rustup target add x86_64-apple-darwin
          rustup target add aarch64-apple-darwin

      - name: Build
        run: |
          cargo build --release --target x86_64-apple-darwin
          cargo build --release --target aarch64-apple-darwin

      - name: Create universal binary
        run: |
          mkdir -p dist
          lipo -create \
            target/x86_64-apple-darwin/release/wtf \
            target/aarch64-apple-darwin/release/wtf \
            -output dist/wtf

      - name: Package
        run: |
          tar czf wtf-macos-universal.tar.gz -C dist wtf

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtf-macos-universal.tar.gz
          path: wtf-macos-universal.tar.gz

  build-windows:
    name: Build Windows 64-bit
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust
        run: |
          curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y
          setx PATH "%USERPROFILE%\.cargo\bin;%PATH%"

      - name: Add target
        run: rustup target add x86_64-pc-windows-gnu

      - name: Build
        run: cargo build --release --target x86_64-pc-windows-gnu

      - name: Package
        run: |
          mkdir dist
          copy target\x86_64-pc-windows-gnu\release\wtf.exe dist\
          powershell Compress-Archive -Path dist\wtf.exe -DestinationPath wtf-windows-x86_64.zip

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wtf-windows-x86_64.zip
          path: wtf-windows-x86_64.zip

  release:
    name: Create GitHub Release
    needs:
      - build-linux
      - build-macos
      - build-windows
    runs-on: ubuntu-latest

    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist

      - name: Show downloaded files (debug)
        run: ls -R dist

      - name: Create Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/**/wtf-linux-amd64.tar.gz
            dist/**/wtf-linux-arm64.tar.gz
            dist/**/wtf-macos-universal.tar.gz
            dist/**/wtf-windows-x86_64.zip
