[package]
name = "wtf"
version = "0.1.0"
edition = "2024"
authors = ["WoodManGitHub"]
readme = "README.md"
repository = "https://github.com/WoodManGitHub/wtf"
license = "MIT"
description = "Find out what the hell is occupying that port."
keywords = ["port", "process", "pid", "wtf"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
sysinfo = "0.31"
colored = "2.1"
libc = "0.2"

[[bin]]
name = "wtf"
path = "src/main.rs"
