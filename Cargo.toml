[package]
name = "wtf"
version = "0.1.1"
edition = "2024"
authors = ["WoodManGitHub"]
readme = "README.md"
repository = "https://github.com/WoodManGitHub/wtf"
license = "MIT"
description = "Find out what the hell is occupying that port."
keywords = ["port", "process", "pid", "wtf"]

[dependencies]
clap = { version = "4.5", features = ["derive"] }
netstat2 = "0.11"
sysinfo = "0.37"
colored = "3.0"

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
windows = { version = "0.62.2", features = ["Win32_System_Threading", "Win32_Security", "Win32_Foundation"] }

[[bin]]
name = "wtf"
path = "src/main.rs"
